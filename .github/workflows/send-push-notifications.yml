name: Notificaciones Push (al cambiar productos o tasa)

on:
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'productos.json'
      # El panel ya no sube productos.json: sube solo lo tocado en cambios/
      # (lo aplica regenerate-artifacts, y su commit, al ser del bot, no
      # dispara este workflow). Por eso se escucha aquí y se aplica en local.
      - 'cambios/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Grupo COMPARTIDO por los tres workflows que ejecutan send_notifications.py
  # (admin-recordatorio, flush-push-queue, send-push-notifications). Antes cada
  # uno tenia el suyo, y GitHub Actions solo serializa DENTRO de un grupo: a las
  # 16:00 UTC coinciden dos crons al minuto exacto, arrancaban a la vez, los dos
  # leian la misma cola y los dos enviaban -> push duplicado a los clientes.
  group: push-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # fetch-depth: 1 basta. El script comparaba el catálogo contra el commit
        # anterior que tocó productos.json, y con `fetch-depth: 20` casi nunca lo
        # tenía: entre dos ediciones del catálogo se cuelan decenas de commits
        # automáticos (sync_resenas.py solo ya mete varios por hora). Ahora el
        # estado anterior vive en la Realtime Database y no en git.

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -r scripts/requirements.txt
      - name: Ver el catálogo como quedará con los cambios del panel
        run: python scripts/aplicar_cambios.py --ref HEAD --salida productos.json
      - name: Detectar cambios y enviar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
