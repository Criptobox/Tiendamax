name: Notificaciones Push (al cambiar productos o tasa)

on:
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'productos.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Grupo COMPARTIDO por los tres workflows que ejecutan send_notifications.py
  # (admin-recordatorio, flush-push-queue, send-push-notifications). Antes cada
  # uno tenia el suyo, y GitHub Actions solo serializa DENTRO de un grupo: a las
  # 16:00 UTC coinciden dos crons al minuto exacto, arrancaban a la vez, los dos
  # leian la misma cola y los dos enviaban -> push duplicado a los clientes.
  group: push-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -r scripts/requirements.txt
      - name: Detectar cambios y enviar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
