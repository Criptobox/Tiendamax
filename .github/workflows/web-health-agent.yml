name: 🤖 Web Health Agent

on:
  schedule:
    # Cada 30 min. GitHub puede retrasarlo algunos minutos.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: web-health-agent
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Probar tienda publicada y avisar
        run: python scripts/web_health_agent.py
        # Sin BOT_TOKEN/ADMIN_CHAT_ID: el dueño quitó este aviso de Telegram
        # (26-sep-2026). Sigue revisando la tienda y guardando el resultado en
        # admin_meta/web_health, que es lo que enseña el Copiloto del panel;
        # send_telegram() no manda nada sin token.
        env:
          SITE_URL: https://tiendamax.org
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
