name: Recordatorio admin (horario pico)

on:
  schedule:
    - cron: '0 16 * * *'    # ~12:00 Cuba (pico mediodía)
    - cron: '0 23 * * *'    # ~19:00 Cuba (pico noche)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Grupo COMPARTIDO por los tres workflows que ejecutan send_notifications.py
  # (admin-recordatorio, flush-push-queue, send-push-notifications). Antes cada
  # uno tenia el suyo, y GitHub Actions solo serializa DENTRO de un grupo: a las
  # 16:00 UTC coinciden dos crons al minuto exacto, arrancaban a la vez, los dos
  # leian la misma cola y los dos enviaban -> push duplicado a los clientes.
  group: push-notifications
  cancel-in-progress: false

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -r scripts/requirements.txt
      - name: Enviar recordatorio al admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SOLO_ADMIN_RECORDATORIO: "1"
        run: python scripts/send_notifications.py
