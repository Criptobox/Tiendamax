name: 📢 Publicar producto nuevo en Telegram

on:
  push:
    branches: [main]
    paths:
      - 'productos.json'
      # Lo que sube el panel desde que dejó de subir el catálogo entero; ver
      # el paso "Ver el catálogo…" más abajo.
      - 'cambios/**'
      - 'data.json'
      - 'config.json'
  workflow_dispatch:

concurrency:
  group: telegram-publish-producto
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # necesita el commit anterior para detectar productos nuevos

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Ver el catálogo como estaba y como quedará con los cambios del panel
        # El push del panel trae solo cambios/*.json: productos.json es el
        # mismo antes y después, así que comparar HEAD~1 con HEAD no vería
        # ningún producto nuevo. Se aplican en local los cambios que había en
        # cada uno de los dos commits, y se compara eso.
        run: |
          python scripts/aplicar_cambios.py --ref HEAD~1 --salida "$RUNNER_TEMP/productos-antes.json" \
            || rm -f "$RUNNER_TEMP/productos-antes.json"
          python scripts/aplicar_cambios.py --ref HEAD --salida productos.json

      - name: Publicar en Telegram y gestionar mensajes
        run: python bot/publish_producto.py
        env:
          PREV_PRODUCTOS_JSON: ${{ runner.temp }}/productos-antes.json
          BOT_TOKEN:        ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}

      - name: Guardar IDs de mensajes
        if: always()
        run: |
          # productos.json quedó con los cambios del panel aplicados solo en
          # local (paso de arriba): con el árbol sucio, el rebase de abajo se
          # niega a arrancar y los IDs no se guardan.
          git checkout -- productos.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/telegram_messages.json
          if git diff --cached --quiet; then
            echo "Sin cambios de IDs para subir"
            exit 0
          fi
          git commit -m "chore: actualizar IDs mensajes Telegram"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ IDs de Telegram guardados."
              exit 0
            fi
            git fetch origin main
            git rebase -X ours origin/main || { git checkout --ours -- bot/telegram_messages.json; git add bot/telegram_messages.json; GIT_EDITOR=true git rebase --continue || git rebase --abort; }
            sleep $((i * 2))
          done
          echo "❌ No se pudieron guardar los IDs de mensajes de Telegram." >&2
          exit 1
