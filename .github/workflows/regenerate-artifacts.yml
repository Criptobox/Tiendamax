name: Regenerar páginas /p/ y /c/, sitemap, subcategorías y comisiones

on:
  push:
    branches:
      - main
    paths:
      - 'productos.json'
      - 'subcategorias.json'
      - 'categorias.json'
      - 'scripts/regenerate_artifacts.py'
      - 'scripts/build_og_images.py'
      # Las tarjetas OG llevan la foto dentro: si cambia la foto (subida nueva,
      # o una pasada de optimize_images.py), la tarjeta hay que rehacerla.
      - 'imagenes/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar el deploy de Pages (los commits del bot no lo hacen solos)

# Evita carreras si llegan varios pushes seguidos
concurrency:
  group: regenerate-artifacts
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Necesitamos token con permiso de write para hacer push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rellenar SEO faltante (seoTitle/seoDescription)
        # Solo completa lo que falte, a partir de datos reales del propio
        # producto (nombre/descripción/categoría) — nunca inventa ni pisa un
        # seoTitle/seoDescription que el admin ya haya puesto a mano. Corre
        # antes del regenerador para que las páginas /p/ nazcan ya con el
        # SEO real en vez del genérico de respaldo ("Nombre — $precio USD").
        run: python scripts/fill_seo.py

      - name: Instalar Pillow (para las tarjetas OG)
        run: pip install --quiet 'Pillow==10.4.0'

      - name: Generar tarjetas OG (1200x630 por producto)
        # Antes del regenerador: es él quien decide si el <meta og:image> apunta
        # a la tarjeta o a la foto suelta, y lo hace mirando si el fichero ya
        # existe en og/.
        run: python scripts/build_og_images.py

      - name: Ejecutar regenerador
        run: python scripts/regenerate_artifacts.py

      - name: Regenerar productos-lite.json (evita que la tienda quede desfasada)
        run: python scripts/build-productos-lite.py

      - name: Commit y push si hubo cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # productos.json entra aquí porque fill_seo.py puede haberlo tocado
          # (rellena seoTitle/seoDescription in place) — sin esto, ese cambio
          # se perdía al terminar el job en vez de quedar publicado.
          # index.html va aquí porque regenerate_home_nav() reescribe la lista
          # de categorías del pie.
          RUTAS="p/ c/ og/ sitemap.xml subcategorias.json comisiones.json productos.json productos-lite.json index.html"

          # Una ruta por vuelta, y NO todas en un solo `git add`: git add es
          # atómico sobre sus pathspecs, así que uno que no coincida aborta el
          # comando entero sin indexar nada. Eso pasaba con comisiones.json, que
          # no existe en el repo y que el regenerador solo escribiría si hubiera
          # comisiones que limpiar: cada corrida moría en "fatal: pathspec
          # 'comisiones.json' did not match any files", el `2>/dev/null || true`
          # se lo tragaba, el paso decía "Sin cambios para subir" y el job
          # terminaba en verde habiendo generado todo.
          # Lo único que llegaba a main eran los ficheros NUEVOS, porque de esos
          # se encargaba el `git ls-files --others`. Las modificaciones y los
          # borrados se descartaban al terminar el job: las páginas /p/ de
          # productos ya existentes, el sitemap y el pie de index.html quedaban
          # congelados, y las páginas de productos borrados no se iban nunca.
          indexar() {
            for ruta in $RUTAS; do
              # -e cubre lo que está en disco; ls-files, lo que el regenerador
              # borró y hay que indexar justamente como borrado.
              if [ -e "$ruta" ] || git ls-files --error-unmatch -- "$ruta" >/dev/null 2>&1; then
                git add -- "$ruta" || { echo "::error::no se pudo indexar $ruta"; exit 1; }
              fi
            done
            git ls-files --others --exclude-standard -- p/ c/ og/ | xargs -r git add
          }

          indexar
          if git diff --cached --quiet; then
            echo "Sin cambios para subir"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # [skip ci] para no disparar de nuevo el workflow de push notifications
          git commit -m "chore: regenerar artefactos (sitemap, /p/, subcats, seo) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ artefactos publicados."
              echo "changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            git fetch origin main
            # --autostash: si algún script deja un fichero tocado que no está en
            # $RUTAS, el rebase se negaba a arrancar y el job moría con el
            # trabajo hecho pero sin publicar. Con esto se aparta solo y sigue.
            if ! git rebase --autostash -X ours origin/main; then
              for ruta in $RUTAS; do
                [ -e "$ruta" ] || git ls-files --error-unmatch -- "$ruta" >/dev/null 2>&1 || continue
                git checkout --ours -- "$ruta" 2>/dev/null || true
              done
              indexar
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 2))
          done
          echo "❌ No se pudieron publicar los artefactos." >&2
          exit 1

      - name: Publicar en GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Disparando el deploy de Pages (los commits del bot no lo disparan solos)…"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
