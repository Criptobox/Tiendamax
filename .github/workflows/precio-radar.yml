name: Radar de precios

on:
  schedule:
    # 1×/día — 11:00 UTC ≈ 7:00 AM hora Cuba (horario tranquilo, no agresivo)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar el deploy de Pages (los commits del bot no lo hacen solos)

# Evita que un workflow_dispatch manual choque con la corrida diaria por cron.
concurrency:
  group: precio-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install -r scripts/requirements.txt
      # AVISO_TELEGRAM: el script deja ahí el aviso (alguien se puso por debajo
      # de tu precio, o ya nadie lo está). NO lo manda él: se manda abajo,
      # cuando el commit ya está en main.
      - name: Ejecutar radar de precios
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AVISO_TELEGRAM: ${{ runner.temp }}/aviso-radar.txt
        run: python scripts/precio_radar.py

      - name: Commit y push de radar.json
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if git diff --cached --quiet; then
            echo "Sin cambios en radar.json."
            exit 0
          fi
          git commit -m "chore: actualizar radar de precios"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ radar.json subido."
              echo "subido=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rechazado (rama detrás); reintegrando sobre origin/main…"
            git fetch origin main
            # radar.json es un archivo generado: ante conflicto conserva SIEMPRE
            # nuestra versión recién creada (en rebase, «theirs» = nuestro commit).
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs -- radar.json 2>/dev/null || true
              git add radar.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 2))
          done
          echo "❌ No se pudo subir radar.json tras varios intentos." >&2
          exit 1

      - name: Avisar por Telegram
        if: success() && steps.commit.outputs.subido == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python scripts/precio_radar.py --enviar-telegram "${{ runner.temp }}/aviso-radar.txt"

      - name: Publicar en GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Disparando el deploy de Pages (los commits del bot no lo disparan solos)…"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
