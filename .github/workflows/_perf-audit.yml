name: (temporal) auditoría de rendimiento

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/_perf_audit.py
