name: run-tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      # test_cartel_titulos.py verifica la lógica del cartel promo, que vive
      # en js/admin-copilot.js y se valida contra productos.json.
      - 'js/admin-copilot.js'
      - 'productos.json'
      # test_admin_handlers.py comprueba que ningún botón de admin.html quede
      # mudo por faltarle el export a window.
      - 'admin.html'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'js/admin-copilot.js'
      - 'productos.json'
      - 'admin.html'

concurrency:
  group: run-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
