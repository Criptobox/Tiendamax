name: Notificaciones programadas (lote diario + cola)

on:
  schedule:
    - cron: '0 13 * * *'    # ~09:00 Cuba
    - cron: '30 14 * * *'   # ~10:30 Cuba
    - cron: '0 16 * * *'    # ~12:00 Cuba
    - cron: '0 17 * * *'    # ~13:00 Cuba — LOTE DIARIO DE PRODUCTOS
    - cron: '30 18 * * *'   # ~14:30 Cuba
    - cron: '0 20 * * *'    # ~16:00 Cuba
    - cron: '0 22 * * *'    # ~18:00 Cuba
    - cron: '30 23 * * *'   # ~19:30 Cuba
    - cron: '0 1 * * *'     # ~21:00 Cuba
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Grupo COMPARTIDO por los tres workflows que ejecutan send_notifications.py
  # (admin-recordatorio, flush-push-queue, send-push-notifications). Antes cada
  # uno tenia el suyo, y GitHub Actions solo serializa DENTRO de un grupo: a las
  # 16:00 UTC coinciden dos crons al minuto exacto, arrancaban a la vez, los dos
  # leian la misma cola y los dos enviaban -> push duplicado a los clientes.
  group: push-notifications
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -r scripts/requirements.txt
      # Ya no se pasa SOLO_FLUSH: la detección corre en todas las pasadas.
      # Compara contra el estado guardado en la base, así que es idempotente —
      # y así un cambio del catálogo que se perdiera en la corrida disparada por
      # el push (commit con [skip ci], fallo de red) lo recoge el siguiente cron
      # en vez de no verse nunca.
      - name: Procesar cola y enviar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
