name: Comparar con la tienda principal

on:
  schedule:
    # Cada hora dentro del horario en que se vende (7:00–23:00 en Cuba =
    # 11–03 UTC). Antes era cada 3 h a en punto, y GitHub retrasa u omite
    # los crons cuando va cargado —sobre todo los de "minuto 0"—: el 24-sep
    # corrió 2 de 5 veces y el panel llegó a enseñar datos de hace 9 h con
    # siete reposiciones sin ver. Más huecos = más probabilidades de que
    # alguno corra, y el minuto 17 esquiva la cola de las horas en punto.
    # No cuesta commits: el script solo escribe si la principal cambió. De
    # madrugada no corre: el aviso al móvil tampoco sale (es_hora_diurna).
    # El botón 🔄 Actualizar del panel lo lanza a mano (workflow_dispatch).
    - cron: '17 0-3,11-23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar el deploy de Pages (los commits del bot no lo hacen solos)

concurrency:
  group: comparar-principal
  cancel-in-progress: false

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install -r scripts/requirements.txt

      # El script detecta las reposiciones comparando con el fichero que dejó
      # la corrida anterior, así que necesita el checkout de siempre — no una
      # copia limpia — y por eso no se le pasa fetch-depth.
      - name: Leer el catálogo de la principal
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/comparar_principal.py

      - name: Commit y push
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # productos.json/-lite.json solo cambian si el script agotó algo que
          # la principal ya no puede servir (ver agotar_mios).
          FICHEROS="principal-catalogo.json principal-fichas.json productos.json productos-lite.json"
          preparar() {
            git add $FICHEROS
            if git diff --cached --quiet; then return 1; fi
            AGOTO=0
            git diff --cached --quiet -- productos.json || AGOTO=1
            if [ "$AGOTO" = 1 ]; then
              git commit -q -m "chore: agotar lo que la tienda principal ya no tiene disponible"
            else
              git commit -q -m "chore: actualizar el catálogo de la tienda principal"
            fi
          }
          if ! preparar; then
            echo "Sin cambios en el catálogo de la principal."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ Subido."
              echo "agoto=$AGOTO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Nada de rebase: productos.json lo escriben también el panel y
            # aplicar_cambios.py, y resolver un conflicto ahí es perder un
            # cambio sin que nadie lo vea. Se parte de lo que hay en main y se
            # vuelve a correr el script, que da el mismo resultado sobre eso.
            echo "Push rechazado (rama detrás); rehaciendo sobre origin/main…"
            git fetch origin main
            git reset --hard origin/main
            python scripts/comparar_principal.py
            if ! preparar; then
              echo "Otra corrida ya lo dejó al día."
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "❌ No se pudo subir tras varios intentos." >&2
          exit 1

      # Los commits hechos con GITHUB_TOKEN no disparan otros workflows. Si se
      # agotó algo, las fichas /p/ (que dicen "Disponible" o "Agotado") se
      # regeneran a mano; ese workflow publica Pages al terminar.
      - name: Regenerar las fichas /p/
        if: success() && steps.commit.outputs.agoto == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/regenerate-artifacts.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Publicar en GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Disparando el deploy de Pages (los commits del bot no lo disparan solos)…"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
