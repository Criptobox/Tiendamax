name: Agente de marketing diario (Telegram)

# Ya no corre solo: el dueño pidió quitar de Telegram el pack del día y la
# checklist de renovar en Revólico (26-sep-2026). Lo que llega a Telegram
# ahora es lo que cambia en la tienda principal (comparar-principal.yml), los
# suscriptores, los interesados/lista de espera y el radar busco/compro. Se
# deja el lanzamiento a mano por si algún día se quiere el pack puntual.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements.txt
      - name: Enviar pack de marketing del día
        run: python scripts/marketing_diario.py
        env:
          BOT_TOKEN:     ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
