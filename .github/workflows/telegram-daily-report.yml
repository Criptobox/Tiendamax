name: 📊 Reporte diario Telegram

# Ya no corre solo: el dueño lo quitó de Telegram (26-sep-2026). Se deja el
# lanzamiento a mano. Ver marketing-diario.yml para lo que sí llega.
on:
  workflow_dispatch:

concurrency:
  group: telegram-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Enviar reporte
        run: python bot/daily_report.py
        env:
          BOT_TOKEN:                ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID:            ${{ secrets.ADMIN_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
