name: Icono de la app según el tema de temporada

# manifest.json dice qué icono lleva la app instalada. Cada día (y cada vez que
# el panel cambia el tema en config.json) se reescribe con los iconos de
# Navidad, Halloween o los de siempre. Ver scripts/tema_icono.py.
on:
  schedule:
    # 00:13 en Cuba (05:13 UTC): el 1 de diciembre la app amanece con gorro.
    - cron: '13 5 * * *'
  push:
    branches: [main]
    paths: ['config.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar el deploy de Pages (los commits del bot no lo hacen solos)

concurrency:
  group: tema-icono
  cancel-in-progress: false

jobs:
  icono:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Si el push choca con otro commit, se rehace sobre origin/main en vez de
      # rebasar: el script es idempotente y solo toca manifest.json.
      - name: Reescribir manifest.json y subirlo
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/tema_icono.py
            if git diff --quiet -- manifest.json; then
              echo "subido=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git add manifest.json
            git commit -q -m "🎨 Icono de la app: tema de temporada"
            if git push -q origin HEAD:main; then
              echo "subido=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "❌ No se pudo subir manifest.json." >&2
          exit 1

      - name: Publicar en GitHub Pages
        if: success() && steps.commit.outputs.subido == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
