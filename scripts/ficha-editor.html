<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de fichas — TiendaMax</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mut:#6b7280;--bd:#e3e6ea;--ac:#2563eb;
--repo:#0891b2;--web:#7c3aed;--mano:#059669;--warn:#b45309;--warnbg:#fef3c7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--tx:#e8eaed;--mut:#9aa1ab;
--bd:#2a2f38;--ac:#60a5fa;--repo:#22d3ee;--web:#a78bfa;--mano:#34d399;--warn:#fbbf24;--warnbg:#3a2f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.hrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:900px;margin:0 auto}
h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);
border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}
#buscar{flex:1;min-width:150px}
.bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;max-width:900px;margin:8px auto 0}
.bar i{display:block;height:100%;background:var(--mano);transition:width .3s}
main{max-width:900px;margin:14px auto;padding:0 14px 60px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.ph img{width:42px;height:42px;object-fit:cover;border-radius:7px;background:var(--bd);flex:none}
.ph b{font-size:14px;display:block;font-weight:600}
.ph small{color:var(--mut);font-size:12px}
.pct{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;
background:var(--bd);color:var(--mut);flex:none}
.pct.ok{background:var(--mano);color:#fff}
.body{display:none;padding:0 12px 12px;border-top:1px solid var(--bd)}
.p.open .body{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
margin:16px 0 7px;font-weight:700}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.row input,.row textarea{flex:1;min-width:0}
.row input.k{flex:0 0 34%}
textarea{resize:vertical;min-height:52px;width:100%}
.o{flex:none;width:30px;height:34px;border-radius:7px;border:1px solid var(--bd);
background:transparent;color:var(--mut);font-size:14px;padding:0;cursor:pointer}
.o[data-o=repo]{color:var(--repo);border-color:var(--repo)}
.o[data-o=web]{color:var(--web);border-color:var(--web)}
.o[data-o=mano]{color:var(--mano);border-color:var(--mano)}
.x{flex:none;width:30px;height:34px;background:transparent;color:var(--mut);
border:1px solid var(--bd);border-radius:7px;padding:0}
.add{background:transparent;color:var(--ac);border:1px dashed var(--bd);
width:100%;padding:7px;font-size:13px;font-weight:600}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 11px;
font-size:13px;margin:10px 0}
.leg{max-width:900px;margin:0 auto;font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);
padding:9px 14px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px}
#msg{color:var(--mano);font-weight:600}
</style></head><body>

<header>
 <div class="hrow">
  <h1>📋 Fichas</h1>
  <input id="buscar" placeholder="Buscar producto…">
  <select id="cat"><option value="">Todas</option></select>
  <select id="est">
   <option value="">Todos</option>
   <option value="inc">Incompletos</option>
   <option value="vac">Sin nada</option>
   <option value="sinq">Specs sin etiqueta</option>
  </select>
 </div>
 <div class="bar"><i id="prog"></i></div>
 <div class="leg" style="margin-top:6px">
  <span style="color:var(--repo)">◆ repo</span>
  <span style="color:var(--web)">◆ internet</span>
  <span style="color:var(--mano)">◆ a mano</span>
  <span id="cuenta"></span>
 </div>
</header>

<main id="lista"></main>

<footer>
 <button id="exp">⬇️ Descargar JSON</button>
 <button class="g" id="cop">📋 Copiar</button>
 <span id="msg"></span>
</footer>

<script src="ficha-datos.js"></script>
<script>
const LS='tm_fichas_v1';
const BASE=window.FICHA_DATOS||[];
let D=[];
try{const s=localStorage.getItem(LS); D=s?JSON.parse(s):structuredClone(BASE);}
catch(e){D=structuredClone(BASE);}
// Si el catálogo creció desde el último guardado, se suman los nuevos.
if(D.length!==BASE.length){
  const vistos=new Set(D.map(p=>p.id));
  BASE.forEach(p=>{if(!vistos.has(p.id))D.push(structuredClone(p));});
}

const ORD=['repo','web','mano'], ICO={repo:'◆',web:'◆',mano:'◆'};
const guardar=()=>{try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Un producto está completo cuando tiene los 5 bloques con algo adentro
// y ninguna spec clave quedó sin etiqueta.
function completo(p){
  const sinEtq=(p.clave||[]).some(c=>!c.k||!c.k.trim());
  return (p.clave||[]).length>0 && !sinEtq && (p.ficha||[]).length>0 &&
         (p.caracteristicas||[]).length>0 && (p.idealPara||[]).length>0 &&
         (p.incluye||[]).length>0;
}
function vacio(p){return !(p.ficha||[]).length && !(p.caracteristicas||[]).length;}
function sinEtiqueta(p){return (p.clave||[]).some(c=>!c.k||!c.k.trim());}

function filtrar(){
  const q=buscar.value.toLowerCase().trim(), c=cat.value, e=est.value;
  return D.filter(p=>{
    if(q && !p.nombre.toLowerCase().includes(q)) return false;
    if(c && p.categoria!==c) return false;
    if(e==='inc' && completo(p)) return false;
    if(e==='vac' && !vacio(p)) return false;
    if(e==='sinq' && !sinEtiqueta(p)) return false;
    return true;
  });
}

function filaKV(p,bloque,i,it,ph1,ph2){
  const o=it.origen||'mano';
  return `<div class="row" data-b="${bloque}" data-i="${i}">
    <button class="o" data-o="${o}" title="Origen: ${o} — clic para cambiar">${ICO[o]}</button>
    <input class="k" placeholder="${ph1}" value="${esc(it.k!==undefined?it.k:it.t)}">
    <input class="v" placeholder="${ph2}" value="${esc(it.v!==undefined?it.v:it.d)}">
    <button class="x" title="Borrar">✕</button></div>`;
}
function filaTxt(p,bloque,i,txt,ph){
  return `<div class="row" data-b="${bloque}" data-i="${i}">
    <input class="v" placeholder="${ph}" value="${esc(txt)}">
    <button class="x" title="Borrar">✕</button></div>`;
}

function pintar(){
  const F=filtrar();
  lista.innerHTML=F.map(p=>{
    const abierto=p._open?' open':'';
    const ok=completo(p);
    const n=[(p.clave||[]).length,(p.ficha||[]).length,(p.caracteristicas||[]).length,
             (p.idealPara||[]).length,(p.incluye||[]).length].filter(x=>x>0).length;
    return `<div class="p${abierto}" data-id="${p.id}">
     <div class="ph"><img src="${esc(p.imagen)}" alt="" loading="lazy">
      <div><b>${esc(p.nombre)}</b><small>${esc(p.categoria)} · $${p.precio}</small></div>
      <span class="pct${ok?' ok':''}">${n}/5</span></div>
     <div class="body">
      ${sinEtiqueta(p)?'<div class="warn">⚠️ Hay specs sin etiqueta. Poné el nombre del dato a la izquierda (ej. <b>Potencia</b> → <b>4000W Pico</b>) para que salgan como tabla.</div>':''}
      <h3>📊 Especificaciones clave <span style="text-transform:none;font-weight:400">(las 4 de arriba)</span></h3>
      ${(p.clave||[]).map((it,i)=>filaKV(p,'clave',i,it,'Potencia','4000W Pico / 1200W Cont.')).join('')}
      <button class="add" data-add="clave">+ dato</button>

      <h3>⚙️ Ficha técnica detallada</h3>
      ${(p.ficha||[]).map((it,i)=>filaKV(p,'ficha',i,it,'Voltaje de Entrada','12V DC')).join('')}
      <button class="add" data-add="ficha">+ dato</button>

      <h3>⚡ Características principales</h3>
      ${(p.caracteristicas||[]).map((it,i)=>filaKV(p,'caracteristicas',i,it,'Seguridad','Protección contra cortocircuito…')).join('')}
      <button class="add" data-add="caracteristicas">+ característica</button>

      <h3>🎯 Ideal para</h3>
      ${(p.idealPara||[]).map((t,i)=>filaTxt(p,'idealPara',i,t,'Hogares con banco de baterías de 12V…')).join('')}
      <button class="add" data-add="idealPara">+ caso de uso</button>

      <h3>📦 ¿Qué incluye la caja?</h3>
      ${(p.incluye||[]).map((t,i)=>filaTxt(p,'incluye',i,t,'1x Manual de usuario')).join('')}
      <button class="add" data-add="incluye">+ ítem</button>
     </div></div>`;
  }).join('')||'<p style="color:var(--mut);text-align:center;padding:40px">Nada con ese filtro.</p>';

  contar(F.length);
}

function contar(enPantalla){
  const hechos=D.filter(completo).length;
  prog.style.width=(hechos/D.length*100)+'%';
  const n=enPantalla===undefined?lista.querySelectorAll('.p').length:enPantalla;
  cuenta.textContent=`${hechos}/${D.length} completos · ${n} en pantalla`;
  lista.querySelectorAll('.p').forEach(el=>{
    const p=D.find(x=>x.id==el.dataset.id); if(!p) return;
    const c=[(p.clave||[]).length,(p.ficha||[]).length,(p.caracteristicas||[]).length,
             (p.idealPara||[]).length,(p.incluye||[]).length].filter(x=>x>0).length;
    const b=el.querySelector('.pct');
    b.textContent=c+'/5'; b.classList.toggle('ok',completo(p));
  });
}

const find=el=>D.find(p=>p.id==el.closest('.p').dataset.id);

lista.addEventListener('click',e=>{
  const p=e.target.closest('.p'); if(!p) return;
  const o=find(e.target);
  if(e.target.closest('.ph')){ o._open=!o._open; p.classList.toggle('open'); return; }
  const add=e.target.dataset.add;
  if(add){
    o[add]=o[add]||[];
    o[add].push(['idealPara','incluye'].includes(add)?'':
      add==='caracteristicas'?{t:'',d:'',origen:'mano'}:{k:'',v:'',origen:'mano'});
    guardar(); pintar(); return;
  }
  const row=e.target.closest('.row'); if(!row) return;
  const b=row.dataset.b, i=+row.dataset.i;
  if(e.target.classList.contains('x')){ o[b].splice(i,1); guardar(); pintar(); return; }
  if(e.target.classList.contains('o')){
    const it=o[b][i];
    it.origen=ORD[(ORD.indexOf(it.origen||'mano')+1)%3];
    guardar(); pintar();
  }
});

lista.addEventListener('input',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const o=find(e.target), b=row.dataset.b, i=+row.dataset.i, v=e.target.value;
  if(b==='idealPara'||b==='incluye'){ o[b][i]=v; }
  else{
    const it=o[b][i];
    const campo=e.target.classList.contains('k')?(b==='caracteristicas'?'t':'k')
                                                :(b==='caracteristicas'?'d':'v');
    it[campo]=v;
    delete it.sinEtiqueta;
    if(it.origen==='repo'){        // editado a mano deja de ser dato del repo
      it.origen='mano';
      const btn=row.querySelector('.o');
      if(btn){btn.dataset.o='mano';btn.title='Origen: mano — clic para cambiar';}
    }
  }
  guardar(); contar();
});

[buscar,cat,est].forEach(el=>el.addEventListener('input',pintar));

cat.innerHTML='<option value="">Todas</option>'+
  [...new Set(D.map(p=>p.categoria))].sort().map(c=>`<option>${esc(c)}</option>`).join('');

function limpiar(){
  return D.map(p=>{
    const {_open,...r}=p;
    return {...r,
      clave:(r.clave||[]).filter(c=>c.v&&c.v.trim()),
      ficha:(r.ficha||[]).filter(c=>c.k&&c.v&&c.k.trim()&&c.v.trim()),
      caracteristicas:(r.caracteristicas||[]).filter(c=>c.t&&c.d&&c.t.trim()&&c.d.trim()),
      idealPara:(r.idealPara||[]).filter(t=>t&&t.trim()),
      incluye:(r.incluye||[]).filter(t=>t&&t.trim())};
  });
}
const aviso=t=>{msg.textContent=t;setTimeout(()=>msg.textContent='',2500);};
exp.onclick=()=>{
  const b=new Blob([JSON.stringify(limpiar(),null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='ficha-datos.json'; a.click();
  URL.revokeObjectURL(a.href); aviso('descargado');
};
cop.onclick=async()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(limpiar(),null,1)); aviso('copiado'); }
  catch(e){ aviso('no se pudo copiar'); }
};

pintar();
</script></body></html>
